<svg width="100%" viewBox="0 0 720 590" role="img" xmlns="http://www.w3.org/2000/svg"
     font-family="'Anthropic Sans', -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title>System architecture</title>
  <desc>Two ingestion paths feed one Neon Postgres database, but both batch their writes.
  The live cloud feeds (two fetch Lambdas) stash fetched records in an S3 buffer; an hourly
  flush Lambda drains S3 into Neon. The bulk crawl + geocode workers (collaborators on their
  own IPs) buffer results in a local SQLite outbox and sync to Neon once an hour. So Neon is
  written, and leased from, only once per hour and can scale to zero in between.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== top band: trigger + external sources ===== -->
  <g>
    <rect x="44" y="34" width="150" height="46" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="119" y="53" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="500">EventBridge</text>
    <text x="119" y="68" text-anchor="middle" fill="#afa9ec" font-size="11">5-min · 12-hr · hourly</text>
  </g>
  <g>
    <rect x="286" y="34" width="148" height="46" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="360" y="53" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="500">Lee County API</text>
    <text x="360" y="68" text-anchor="middle" fill="#b4b2a9" font-size="11">sheriff + traffic</text>
  </g>
  <g>
    <rect x="528" y="34" width="148" height="46" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="602" y="53" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="500">Geocoders</text>
    <text x="602" y="68" text-anchor="middle" fill="#b4b2a9" font-size="11">Census · OSM · Nominatim</text>
  </g>

  <!-- ===== producers ===== -->
  <g>
    <rect x="44" y="132" width="210" height="56" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="149" y="154" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="500">Fetch Lambdas</text>
    <text x="149" y="172" text-anchor="middle" fill="#afa9ec" font-size="11">traffic 5-min · incidents 12-hr</text>
  </g>
  <g>
    <rect x="430" y="132" width="246" height="56" rx="8" fill="#5c4014" stroke="#d9a45a" stroke-width="0.5"/>
    <text x="553" y="154" text-anchor="middle" fill="#f0d6a8" font-size="14" font-weight="500">Crawl + geocode workers</text>
    <text x="553" y="172" text-anchor="middle" fill="#d9a45a" font-size="11">collaborators, each on their own IP</text>
  </g>

  <!-- ===== buffers (dashed = durable write buffer) ===== -->
  <g>
    <rect x="44" y="240" width="210" height="56" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="149" y="262" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="500">S3 buffer</text>
    <text x="149" y="280" text-anchor="middle" fill="#afa9ec" font-size="11">pending/&lt;source&gt;/*.json</text>
  </g>
  <g>
    <rect x="430" y="240" width="246" height="56" rx="8" fill="#5c4014" stroke="#d9a45a" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="553" y="262" text-anchor="middle" fill="#f0d6a8" font-size="14" font-weight="500">Local SQLite outbox</text>
    <text x="553" y="280" text-anchor="middle" fill="#d9a45a" font-size="11">durable, one per worker</text>
  </g>

  <!-- ===== hourly flush ===== -->
  <g>
    <rect x="44" y="348" width="210" height="52" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="149" y="368" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="500">Flush Lambda</text>
    <text x="149" y="385" text-anchor="middle" fill="#afa9ec" font-size="11">hourly: drain → upsert</text>
  </g>
  <g>
    <rect x="430" y="348" width="246" height="52" rx="8" fill="#5c4014" stroke="#d9a45a" stroke-width="0.5"/>
    <text x="553" y="368" text-anchor="middle" fill="#f0d6a8" font-size="14" font-weight="500">Worker hourly sync</text>
    <text x="553" y="385" text-anchor="middle" fill="#d9a45a" font-size="11">flush outbox · lease work</text>
  </g>

  <!-- ===== database ===== -->
  <g>
    <rect x="248" y="456" width="224" height="68" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="360" y="478" text-anchor="middle" fill="#9fe1cb" font-size="14" font-weight="500">Neon Postgres</text>
    <text x="360" y="496" text-anchor="middle" fill="#5dcaa5" font-size="11">incidents · geocode_cache · crawl_queries</text>
    <text x="360" y="512" text-anchor="middle" fill="#5dcaa5" font-size="11">written / leased once per hour</text>
  </g>

  <!-- ===== edges ===== -->
  <!-- triggers / sources -->
  <line x1="119" y1="80" x2="119" y2="130" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <line x1="338" y1="80" x2="210" y2="130" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <line x1="392" y1="80" x2="500" y2="130" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <line x1="602" y1="80" x2="602" y2="130" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <!-- producers -> buffers -->
  <line x1="149" y1="188" x2="149" y2="238" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <text x="157" y="217" fill="#9c9a92" font-size="10.5">stash · no Neon</text>
  <line x1="553" y1="188" x2="553" y2="238" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <text x="561" y="217" fill="#9c9a92" font-size="10.5">buffer offline</text>
  <!-- buffers -> flush -->
  <line x1="149" y1="296" x2="149" y2="346" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <line x1="553" y1="296" x2="553" y2="346" marker-end="url(#arrow)" fill="none" stroke="#9c9a92" stroke-width="1.5"/>
  <!-- flush -> Neon (the once-an-hour write) -->
  <line x1="160" y1="400" x2="296" y2="454" marker-end="url(#arrow)" fill="none" stroke="#5dcaa5" stroke-width="1.5"/>
  <text x="150" y="432" fill="#7fb8a3" font-size="10.5">hourly upsert</text>
  <line x1="542" y1="400" x2="424" y2="454" marker-start="url(#arrow)" marker-end="url(#arrow)" fill="none" stroke="#5dcaa5" stroke-width="1.5"/>
  <text x="470" y="432" fill="#7fb8a3" font-size="10.5">flush + lease</text>

  <!-- ===== caption ===== -->
  <text x="360" y="548" text-anchor="middle" fill="#d9a45a" font-size="12.5" font-weight="500">Every path buffers its writes and touches Neon once an hour — so it scales to zero in between.</text>

  <!-- ===== legend ===== -->
  <g transform="translate(96, 566)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#3c3489" stroke="#afa9ec" stroke-width="0.5"/>
    <text x="18" y="10" fill="#c2c0b6" font-size="11.5">AWS</text>
    <rect x="78" y="0" width="13" height="13" rx="3" fill="#085041" stroke="#5dcaa5" stroke-width="0.5"/>
    <text x="96" y="10" fill="#c2c0b6" font-size="11.5">Database</text>
    <rect x="186" y="0" width="13" height="13" rx="3" fill="#444441" stroke="#b4b2a9" stroke-width="0.5"/>
    <text x="204" y="10" fill="#c2c0b6" font-size="11.5">External services</text>
    <rect x="330" y="0" width="13" height="13" rx="3" fill="#5c4014" stroke="#d9a45a" stroke-width="0.5"/>
    <text x="348" y="10" fill="#c2c0b6" font-size="11.5">Collaborators (crawl)</text>
    <rect x="492" y="0" width="13" height="13" rx="3" fill="none" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="510" y="10" fill="#c2c0b6" font-size="11.5">write buffer</text>
  </g>
</svg>
