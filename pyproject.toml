[project]
name = "leecad"
version = "0.1.0"
description = "Lee County CAD data engine: harvest, normalize, geocode, and archive public-safety incident records"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
leecad = "leecad.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
    # boto3 is provided by the Lambda runtime in prod; needed locally only for
    # `leecad flush-s3` and any future S3 tests.
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110