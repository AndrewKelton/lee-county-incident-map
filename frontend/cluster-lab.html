<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBSCAN Cluster Lab — Lee County</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ─────────────────────────────────────────────────────────── */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(15, 15, 30, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    #branding { line-height: 1.3; }
    #branding strong { font-size: 1rem; color: #fff; }
    #branding span   { display: block; font-size: 0.72rem; color: #888; }

    /* ── Sliders ──────────────────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .param-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .param-row label {
      font-size: 0.75rem;
      color: #aaa;
      white-space: nowrap;
    }

    .param-row label span {
      color: #fff;
      font-weight: 600;
    }

    /* ── Level controls ─────────────────────────────────────────────────── */
    .level-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0.45rem 0.65rem;
      border-left: 3px solid var(--accent);
      background: rgba(255,255,255,0.03);
      border-radius: 0 4px 4px 0;
      min-width: 185px;
      transition: opacity 0.2s;
    }
    .level-block.level-off { opacity: 0.4; }
    .level-block[data-level="district"]     { --accent: #0E6207; }
    .level-block[data-level="neighborhood"] { --accent: #243092; }
    .level-block[data-level="street"]       { --accent: #E63946; }

    .level-header { display: flex; align-items: center; gap: 0.5rem; }
    .level-name   { font-size: 0.8rem; font-weight: 600; color: var(--accent); }
    .level-hint   { font-size: 0.67rem; color: #555; }

    /* Custom toggle switch */
    .toggle-label {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 17px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle-label input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 17px;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 11px; height: 11px;
      background: #fff;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle-label input:checked + .toggle-track { background: var(--accent); }
    .toggle-label input:checked + .toggle-track::after { transform: translateX(13px); }

    .level-slider-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; color: #666; }
    .level-slider     { width: 110px; accent-color: var(--accent); cursor: pointer; }

    .level-stats { display: flex; gap: 0.35rem; }
    .level-stats .stat-pill { font-size: 0.7rem; padding: 0.1rem 0.4rem; }

    /* ── Stats ────────────────────────────────────────────────────────────── */
    #stats {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.8rem;
      color: #aaa;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
    }

    .stat-pill span { color: #fff; font-weight: 600; }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #status-dot.loading  { background: #E9C46A; }
    #status-dot.ready    { background: #2A9D8F; }
    #status-dot.error    { background: #E63946; }

    /* ── Map ──────────────────────────────────────────────────────────────── */
    #map { flex: 1; }

    /* ── Legend ───────────────────────────────────────────────────────────── */
    .cluster-legend {
      background: rgba(15, 15, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      color: #eee;
      line-height: 1.8;
    }
    .legend-swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div id="top-bar">
  <div id="branding">
    <strong>DBSCAN Cluster Lab</strong>
    <span>Lee County Incidents — dev prototype</span>
  </div>

  <div id="controls">

    <div class="level-block" id="level-block-district" data-level="district">
      <div class="level-header">
        <label class="toggle-label">
          <input type="checkbox" class="level-toggle" data-level="district" checked />
          <span class="toggle-track"></span>
        </label>
        <span class="level-name">District</span>
        <span class="level-hint">macro &middot; 2&ndash;6 mi</span>
      </div>
      <div class="level-slider-row">
        <span>Sparse</span>
        <input type="range" class="level-slider" id="slider-district" data-level="district"
               min="0" max="100" step="1" value="50" />
        <span>Dense</span>
      </div>
      <div class="level-stats">
        <span class="stat-pill">Clusters: <span id="stat-clusters-district">&mdash;</span></span>
        <span class="stat-pill">Noise: <span id="stat-noise-district">&mdash;</span></span>
      </div>
    </div>

    <div class="level-block" id="level-block-neighborhood" data-level="neighborhood">
      <div class="level-header">
        <label class="toggle-label">
          <input type="checkbox" class="level-toggle" data-level="neighborhood" checked />
          <span class="toggle-track"></span>
        </label>
        <span class="level-name">Neighborhood</span>
        <span class="level-hint">meso &middot; 0.5&ndash;2 mi</span>
      </div>
      <div class="level-slider-row">
        <span>Sparse</span>
        <input type="range" class="level-slider" id="slider-neighborhood" data-level="neighborhood"
               min="0" max="100" step="1" value="50" />
        <span>Dense</span>
      </div>
      <div class="level-stats">
        <span class="stat-pill">Clusters: <span id="stat-clusters-neighborhood">&mdash;</span></span>
        <span class="stat-pill">Noise: <span id="stat-noise-neighborhood">&mdash;</span></span>
      </div>
    </div>

    <div class="level-block" id="level-block-street" data-level="street">
      <div class="level-header">
        <label class="toggle-label">
          <input type="checkbox" class="level-toggle" data-level="street" checked />
          <span class="toggle-track"></span>
        </label>
        <span class="level-name">Street</span>
        <span class="level-hint">micro &middot; 300&ndash;2500 ft</span>
      </div>
      <div class="level-slider-row">
        <span>Sparse</span>
        <input type="range" class="level-slider" id="slider-street" data-level="street"
               min="0" max="100" step="1" value="50" />
        <span>Dense</span>
      </div>
      <div class="level-stats">
        <span class="stat-pill">Clusters: <span id="stat-clusters-street">&mdash;</span></span>
        <span class="stat-pill">Noise: <span id="stat-noise-street">&mdash;</span></span>
      </div>
    </div>

  </div>

  <div id="stats">
    <div id="status-dot"></div>
    <div class="stat-pill">Total pts: <span id="stat-total">&mdash;</span></div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const API = "";  // same-origin when served by Flask at /cluster-lab

  const LEE_COUNTY_CENTER = [26.56, -81.87];
  const DEFAULT_ZOOM = 11;

  // Map setup
  const map = L.map("map").setView(LEE_COUNTY_CENTER, DEFAULT_ZOOM);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  // Per-level visual constants
  // District drawn first (bottom), neighborhood middle, street on top
  const LEVEL_STYLES = {
    district:     { fillOpacity: 0.07, weight: 1,   opacity: 0.45, pointRadius: 4,  noiseRadius: 2 },
    neighborhood: { fillOpacity: 0.14, weight: 1.5, opacity: 0.65, pointRadius: 6,  noiseRadius: 3 },
    street:       { fillOpacity: 0.26, weight: 2,   opacity: 0.85, pointRadius: 8,  noiseRadius: 4 },
  };

  // State — one layer group per level
  const levelLayers  = { district: null, neighborhood: null, street: null };
  let legendControl  = null;
  // Last received GeoJSON per level (for legend rebuild on toggle)
  const levelData    = { district: null, neighborhood: null, street: null };
  // Toggle visibility (true = visible on map)
  const levelVisible = { district: true,  neighborhood: true,  street: true  };
  // Metadata from last successful fetch per level
  const levelMeta    = { district: null,  neighborhood: null,  street: null  };
  // Per-level debounce timers for slider-triggered refetches
  const levelTimers  = { district: null,  neighborhood: null,  street: null  };

  // Helpers
  function setStatus(state) {
    const dot = document.getElementById("status-dot");
    dot.className = "";
    if (state) dot.classList.add(state);
  }

  // Legend — rebuilt from all currently-loaded level data
  const LEVEL_LABELS = { district: "District", neighborhood: "Neighborhood", street: "Street" };

  function buildLegend() {
    if (legendControl) { legendControl.remove(); legendControl = null; }

    const levels = ["district", "neighborhood", "street"];
    const sections = levels
      .filter(s => levelData[s] !== null && levelVisible[s])
      .map(s => {
        const polygons = levelData[s].features.filter(f => f.properties.feature_type === "polygon");
        if (!polygons.length) return "";
        const rows = polygons
          .map(f =>
            `<div><span class="legend-swatch" style="background:${f.properties.color}"></span>` +
            `Cluster ${f.properties.cluster_id} — ${f.properties.point_count} pts</div>`
          ).join("");
        return `<div style="margin-bottom:0.4rem"><strong style="font-size:0.7rem;color:#aaa;text-transform:uppercase;letter-spacing:0.05em">${LEVEL_LABELS[s]}</strong>${rows}</div>`;
      })
      .join("");

    if (!sections.replace(/<[^>]*>/g, "").trim()) return;

    legendControl = L.control({ position: "bottomright" });
    legendControl.onAdd = () => {
      const div = L.DomUtil.create("div", "cluster-legend");
      div.innerHTML = sections;
      return div;
    };
    legendControl.addTo(map);
  }

  // Cluster rendering — level-aware
  // Draw order: district (bottom) → neighborhood → street (top)
  const LEVEL_DRAW_ORDER = ["district", "neighborhood", "street"];

  function renderLevelLayer(level, geojson) {
    // Tear down existing layer for this level
    if (levelLayers[level]) { map.removeLayer(levelLayers[level]); }

    const st       = LEVEL_STYLES[level];
    const polygons = geojson.features.filter(f => f.properties.feature_type === "polygon");
    const pts      = geojson.features.filter(f => f.properties.feature_type === "point");

    const group = L.layerGroup();

    // Polygons first (drawn beneath points within this level)
    L.geoJSON({ type: "FeatureCollection", features: polygons }, {
      style: feature => ({
        fillColor: feature.properties.color,
        color:     feature.properties.color,
        fillOpacity: st.fillOpacity,
        weight:      st.weight,
        opacity:     st.opacity,
      }),
      onEachFeature: (feature, layer) => {
        layer.bindTooltip(
          `[${LEVEL_LABELS[level]}] Cluster ${feature.properties.cluster_id} — ${feature.properties.point_count} incidents`,

          { sticky: true }
        );
      },
    }).addTo(group);

    // Points on top
    L.geoJSON({ type: "FeatureCollection", features: pts }, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng, {
          radius:      feature.properties.cluster_id === -1 ? st.noiseRadius : st.pointRadius,
          fillColor:   feature.properties.color,
          color:       "#fff",
          weight:      0.5,
          fillOpacity: feature.properties.cluster_id === -1 ? 0.35 : 0.85,
        }),
      onEachFeature: (feature, layer) => {
        const label = feature.properties.cluster_id === -1
          ? `[${LEVEL_LABELS[level]}] Noise`
          : `[${LEVEL_LABELS[level]}] Cluster ${feature.properties.cluster_id}`;
        layer.bindTooltip(label, { sticky: true });
      },
    }).addTo(group);

    levelLayers[level] = group;
    levelData[level]   = geojson;

    // Re-add all level layers in draw order so z-order is always correct
    LEVEL_DRAW_ORDER.forEach(s => {
      if (levelLayers[s]) {
        map.removeLayer(levelLayers[s]);
        if (levelVisible[s]) levelLayers[s].addTo(map);
      }
    });

    buildLegend();
  }

  // Per-level DBSCAN parameter ranges
  // slider=0 (Sparse): large eps, low min_pts  → few big clusters
  // slider=100 (Dense): small eps, high min_pts → many tight clusters
  const LEVEL_PRESETS = {
    district:     { epsMax: 30000, epsMin: 10000, ptsMin: 15, ptsMax: 50 },
    neighborhood: { epsMax: 10000, epsMin: 3000,  ptsMin: 5,  ptsMax: 20 },
    street:       { epsMax: 2500,  epsMin: 300,   ptsMin: 2,  ptsMax: 8  },
  };

  function levelToParams(level, sliderVal) {
    const t = sliderVal / 100;
    const p = LEVEL_PRESETS[level];
    // Log scale for eps: gives perceptually uniform spacing across the radius range
    // At t=0 (Sparse) → epsMax; at t=1 (Dense) → epsMin
    const eps = Math.round(Math.exp(Math.log(p.epsMax) + (Math.log(p.epsMin) - Math.log(p.epsMax)) * t));
    return {
      eps,
      minPts: Math.round(p.ptsMin + (p.ptsMax - p.ptsMin) * t),
    };
  }

  function updateLevelStats(level, meta) {
    document.getElementById(`stat-clusters-${level}`).textContent =
      meta ? meta.n_clusters : "—";
    document.getElementById(`stat-noise-${level}`).textContent =
      meta ? meta.n_noise : "—";
    if (meta) document.getElementById("stat-total").textContent = meta.n_total;
  }

  // Fetch a single level's clusters from the backend
  async function fetchLevel(level) {
    if (!levelVisible[level]) return;
    const sliderVal = Number(document.getElementById(`slider-${level}`).value);
    const { eps, minPts } = levelToParams(level, sliderVal);
    try {
      const res = await fetch(`${API}/api/clusters?eps=${eps}&min_pts=${minPts}&level=${level}`);      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      levelMeta[level] = data.metadata;
      renderLevelLayer(level, data);
      updateLevelStats(level, data.metadata);
    } catch (err) {
      console.error(`Cluster fetch failed for level "${level}":`, err);
      levelMeta[level] = null;
      updateLevelStats(level, null);
    }
  }

  // Fetch all visible levels in parallel via the multi endpoint
  async function fetchAllLevels() {
    setStatus("loading");
    try {
      const res = await fetch(`${API}/api/clusters/multi`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      ["district", "neighborhood", "street"].forEach(level => {
        if (levelVisible[level] && data[level]) {
          levelMeta[level] = data[level].metadata;
          renderLevelLayer(level, data[level]);
          updateLevelStats(level, data[level].metadata);
        }
      });
      setStatus(Object.values(levelMeta).some(m => m !== null) ? "ready" : "error");
    } catch (err) {
      console.error("Multi-level fetch failed:", err);
      setStatus("error");
    }
  }

  // Per-level debounced fetch triggered by slider input
  function scheduleLevel(level) {
    clearTimeout(levelTimers[level]);
    levelTimers[level] = setTimeout(async () => {
      setStatus("loading");
      await fetchLevel(level);
      setStatus(Object.values(levelMeta).some(m => m !== null) ? "ready" : "error");
    }, 400);
  }

  // Wire toggle checkboxes
  document.querySelectorAll(".level-toggle").forEach(checkbox => {
    checkbox.addEventListener("change", () => {
      const level = checkbox.dataset.level;
      levelVisible[level] = checkbox.checked;
      document.getElementById(`level-block-${level}`)
        .classList.toggle("level-off", !checkbox.checked);

      if (checkbox.checked) {
        if (levelLayers[level]) {
          // Data already loaded — restore in correct draw order
          LEVEL_DRAW_ORDER.forEach(s => {
            if (levelLayers[s]) {
              map.removeLayer(levelLayers[s]);
              if (levelVisible[s]) levelLayers[s].addTo(map);
            }
          });
        } else {
          fetchLevel(level);
        }
      } else {
        if (levelLayers[level]) map.removeLayer(levelLayers[level]);
      }
      buildLegend();
    });
  });

  // Wire per-level density sliders
  document.querySelectorAll(".level-slider").forEach(slider => {
    slider.addEventListener("input", () => scheduleLevel(slider.dataset.level));
  });

  // boot
  fetchAllLevels();
})();
</script>
</body>
</html>
